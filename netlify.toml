[build]
  command = "git submodule update --init --recursive && hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.2"
  HUGO_ENV = "production"
  HUGO_CACHEDIR = "/tmp/hugo_cache"

[[redirects]]
  from = "/Reverse-Engineering Understanding.pdf"
  to = "https://philpapers.org/archive/QUEWWC-2.pdf"
  status = 301

[[redirects]]
  from = "/Reverse-Engineering%20Understanding.pdf"
  to = "https://philpapers.org/archive/QUEWWC-2.pdf"
  status = 301

[[redirects]]
  from = "/articles/"
  to = "/"
  status = 301

[[redirects]]
  from = "/articles/philosophy/"
  to = "/"
  status = 301

[[redirects]]
  from = "/articles/oup/"
  to = "/"
  status = 301

[[redirects]]
